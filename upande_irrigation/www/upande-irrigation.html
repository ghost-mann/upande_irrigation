<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ product_name }}{% if organisation %} · {{ organisation }}{% endif %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/upande_irrigation/css/tokens.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/assets/upande_irrigation/css/shell.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/assets/upande_irrigation/css/views.css?v={{ asset_version }}">
</head>
<body>

<div class="topbar">
  <div class="topbar__brand">
    <img class="topbar__logo" alt="Upande" src="/assets/upande_irrigation/images/upande-logo.png?v={{ asset_version }}">
    <div class="topbar__divider"></div>
    <div class="topbar__product">{{ product_name }}{% if organisation %}<small>{{ organisation }}</small>{% endif %}</div>
  </div>
  <nav class="topbar__nav">
    <a href="#overview" class="on">Irrigation</a>
    <a href="/desk/upande-irrigation" title="Upande Irrigation workspace">Records</a>
    <a href="/app" title="Frappe Desk">Desk</a>
  </nav>
  <div class="topbar__right">
    <span>{{ current_user }}</span>
    <div class="avatar">{{ user_initials }}</div>
  </div>
</div>

<div id="ui-root">
  <div class="loading">Loading Upande Irrigation…</div>
</div>

<script>
  window.IRRIGATION_BOOT = {
    csrf_token: {{ csrf_token | tojson }},
    user: {{ current_user | tojson }},
    user_label: {{ user_label | tojson }},
    user_initials: {{ user_initials | tojson }},
    product_name: {{ product_name | tojson }},
    organisation: {{ organisation | tojson }},
    farms: {{ farms | tojson }},
    today: {{ today | tojson }},
  };
  window.csrf_token = window.IRRIGATION_BOOT.csrf_token;
</script>

<script type="module">
  import { Shell } from '/assets/upande_irrigation/js/dashboard/shell.js?v={{ asset_version }}';

  import overview  from '/assets/upande_irrigation/js/dashboard/view_overview.js?v={{ asset_version }}';
  import planner   from '/assets/upande_irrigation/js/dashboard/view_planner.js?v={{ asset_version }}';
  import weather   from '/assets/upande_irrigation/js/dashboard/view_weather.js?v={{ asset_version }}';
  import compare   from '/assets/upande_irrigation/js/dashboard/view_compare.js?v={{ asset_version }}';
  import iot       from '/assets/upande_irrigation/js/dashboard/view_iot.js?v={{ asset_version }}';
  import resources from '/assets/upande_irrigation/js/dashboard/view_resources.js?v={{ asset_version }}';
  import map       from '/assets/upande_irrigation/js/dashboard/view_map.js?v={{ asset_version }}';
  import now       from '/assets/upande_irrigation/js/dashboard/view_now.js?v={{ asset_version }}';
  import control   from '/assets/upande_irrigation/js/dashboard/view_control.js?v={{ asset_version }}';

  const shell = new Shell({
    mount: document.getElementById('ui-root'),
    boot:  window.IRRIGATION_BOOT,
    views: [overview, planner, weather, compare, iot, resources, map, now, control],
  });

  window.IRRIGATION_SHELL = shell;
  shell.start();
</script>

</body>
</html>
